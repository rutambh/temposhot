name: temposhot_pro
description: "TempoShot Pro - Offline Acoustic Sports Shot Timer & Drill Suite"
publish_to: 'none'

version: 1.0.0+100

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.4
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  record: ^7.1.1
  sqflite_common_ffi_web: ^1.2.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true

  assets:
    - assets/audio/beep.wav

  # Bundled, never fetched at runtime: the app keeps a strict zero-network
  # guarantee, so google_fonts style runtime fetching is not an option.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans.ttf
