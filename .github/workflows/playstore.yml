name: Release to Google Play (Internal Testing)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Keep the signed AAB as a 1-day artifact (successful runs otherwise store nothing)'
        type: boolean
        default: false

concurrency:
  group: release-playstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Sign & Deploy ${{ matrix.flavor_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: lite
            flavor_name: "TempoShot"
            package_name: "com.rutambh.temposhot"
            output_dir: "build/app/outputs/bundle/liteRelease"
            artifact_name: "temposhot-lite"
          - flavor: pro
            flavor_name: "TempoShot Pro"
            package_name: "com.rutambh.temposhot.pro"
            output_dir: "build/app/outputs/bundle/proRelease"
            artifact_name: "temposhot-pro"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Calculate Dynamic Version
        id: version
        shell: bash
        run: |
          # Use GITHUB_RUN_NUMBER with base offset 99 so Run 1 -> Code 100 -> Version 1.0.0
          RUN_NUMBER=${{ github.run_number }}
          BASE_OFFSET=99
          VERSION_CODE=$(( RUN_NUMBER + BASE_OFFSET ))

          # Base-10 Carry Formula (100 -> 1.0.0, 109 -> 1.0.9, 110 -> 1.1.0)
          MAJOR=$(( VERSION_CODE / 100 ))
          MINOR=$(( (VERSION_CODE % 100) / 10 ))
          PATCH=$(( VERSION_CODE % 10 ))
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"

          echo "=================================================="
          echo "CI Dynamic Versioning (${{ matrix.flavor_name }}):"
          echo "  GITHUB_RUN_NUMBER : $RUN_NUMBER"
          echo "  versionCode       : $VERSION_CODE"
          echo "  versionName       : $VERSION_NAME"
          echo "  packageId         : ${{ matrix.package_name }}"
          echo "=================================================="

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Unsigned Android App Bundle (AAB)
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            flutter build appbundle --release \
              --flavor ${{ matrix.flavor }} \
              --dart-define=FLAVOR=${{ matrix.flavor }} \
              --build-name="${{ env.VERSION_NAME }}" \
              --build-number="${{ env.VERSION_CODE }}"
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "::warning::AAB build attempt $attempt failed (exit $status); retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Sign Android App Bundle
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: ${{ matrix.output_dir }}
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ matrix.package_name }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB as Workflow Artifact
        if: ${{ failure() || inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ env.VERSION_CODE }}
          path: ${{ matrix.output_dir }}/*.aab
          if-no-files-found: ignore
          retention-days: 1

      - name: Deploy to Google Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.package_name }}
          releaseFiles: ${{ matrix.output_dir }}/*.aab
          track: internal
          whatsNewDirectory: cicd/whatsnew
          status: completed
          changesNotSentForReview: true